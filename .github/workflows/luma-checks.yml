name: Luma quality gates

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: luma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Audit, translations, behaviour, packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LUMA-STORE

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: LUMA-STORE/tools/package-lock.json

      - name: Install tooling
        working-directory: LUMA-STORE/tools
        run: npm ci

      # Every PHP/JS/CSS file in both packages: escaping, duplicate ids,
      # unbalanced braces, version drift, dead code and template hierarchy.
      - name: Static audit
        run: node tools/audit.js

      # Fails if a string was added or changed without regenerating the .pot.
      - name: Translation templates
        run: node tools/make-pot.js --check

      # Executes theme.js in a minimal DOM built from the preview page and
      # asserts the observable behaviour of each feature it drives.
      - name: Behaviour smoke test
        run: node tools/smoke-test.js

      # Rebuilds the ZIPs from source and compares digests, so a package can
      # never drift away from the tree it was built from.
      - name: Package parity
        run: node tools/build-packages.js --check

      - name: Report digests
        if: always()
        run: cat packages/SHA256SUMS.txt
